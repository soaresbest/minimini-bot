name: Verificações

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=high
      - name: Sintaxe Bash
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for script in install.sh start.sh install.command start.command scripts/runtime.sh scripts/vscode-prepare.sh scripts/vscode-node.sh; do
            bash -n "$script"
          done
      - name: Sintaxe Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($path in @('install.ps1', 'start.ps1', 'scripts/runtime.ps1', 'scripts/vscode-prepare.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Out-String | Write-Error
              exit 1
            }
          }
      - name: Ajuda do instalador Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -Help
